
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestione Servizi Funebri</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      margin: 0;
      padding: 20px;
      color: #17243a;
    }
    h1 { text-align: center; }
    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 14px;
      box-shadow: 0 2px 8px #0001;
    }
    button {
      background: #183b68;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Gestione Servizi Funebri</h1>
  <p>Organizzazione dei servizi e del personale</p>

  <div class="card">
    <h2>📅 Servizi funebri</h2>
    <p>Gestisci orari, luoghi e destinazioni.</p>
    <button onclick="alert('Funzione in preparazione')">
      Visualizza servizi
    </button>
  </div>

  <div class="card">
    <h2>👥 Dipendenti</h2>
    <p>Gestisci il personale disponibile.</p>
    <button onclick="alert('Funzione in preparazione')">
      Visualizza dipendenti
    </button>
  </div>

  <div class="card">
    <h2>✅ Disponibilità</h2>
    <p>Accetta o rifiuta le richieste di servizio.</p>
    <button onclick="alert('Funzione in preparazione')">
      Le mie richieste
    </button>
  </div>

  <div class="card">
    <h2>🚐 Squadre</h2>
    <p>Visualizza i colleghi assegnati ai servizi.</p>
    <button onclick="alert('Funzione in preparazione')">
      Visualizza squadre
    </button>
  </div>
</body>
</html>
